# Lint, type-check and test the backend and the frontend on every push to main and every PR.
# The same commands as `make check` and `make web-check`, plus a check that the frontend's
# generated API types still match the backend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # The integration tests need the real Postgres + pgvector, as in docker-compose.yml.
      db:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: resume
          POSTGRES_PASSWORD: resume
          POSTGRES_DB: resume_matcher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resume -d resume_matcher"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://resume:resume@127.0.0.1:5432/resume_matcher
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies (CPU-only PyTorch first)
        # The default Linux torch wheel pulls in ~2 GB of CUDA libraries the tests never use.
        run: |
          TORCH=$(python -c "import tomllib; print(next(d for d in tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies'] if d.startswith('torch==')))")
          pip install "$TORCH" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Cache the embedding model
        # Tests marked `model` load all-MiniLM-L6-v2 (~90 MB); download it once, not every run.
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Lint and format check
        run: |
          ruff check . ../scripts
          ruff format --check . ../scripts

      - name: Type-check
        run: mypy app tests ../scripts

      - name: Tests
        # CI=true (set by GitHub) makes the database tests fail, not skip, if Postgres is missing.
        run: pytest

      - name: OpenAPI schema is up to date
        # frontend/openapi.json must match the API; run `make types` after changing a route.
        run: |
          python ../scripts/export_openapi.py
          git diff --exit-code -- ../frontend/openapi.json

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: API types match openapi.json
        # src/types/api.ts is generated from openapi.json; run `make types` after changing it.
        run: |
          npm run generate:types
          git diff --exit-code -- src/types/api.ts
