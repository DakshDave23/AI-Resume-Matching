# The single-page app, plus /api/ forwarded to the backend container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # One upload batch: up to 50 resumes of 5 MB each, plus form overhead.
    client_max_body_size 260m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploading a full batch or re-scoring a big job can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Stream uploads to the API instead of buffering them on disk first.
        proxy_request_buffering off;
    }

    # Built assets have content hashes in their names: cache them for good.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # Every other path is a page of the app: index.html, never cached, so a new build shows up.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
