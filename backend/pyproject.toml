[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-matcher-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Resume Matching & Ranking System"
license = "MIT"
requires-python = ">=3.12,<3.13"
# Exact pins: each build step adds only the packages it needs.
dependencies = [
    "fastapi==0.163.2",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.34",  # file uploads (step 19)
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.9",
    "psycopg[binary]==3.3.9",
    "alembic==1.20.1",
    "pgvector==0.5.1",
    "numpy==2.5.5",
    "pymupdf==2.1",  # PDF text extraction (step 8); also renders the sample PDFs
    "python-docx==1.2.0",  # DOCX text extraction (step 8); also renders the sample DOCX files
    "rapidfuzz==3.14.6",  # fuzzy section headers (step 9) and skill variants
    "phonenumbers==9.0.43",  # phone validation and E.164 normalisation (step 10)
    "spacy==3.8.18",  # tokenizer + PhraseMatcher for skills (step 11); no model download needed
    # Sentence embeddings (step 17). PyPI's torch is CPU-only on Windows and macOS; on
    # Linux install the CPU build first to skip ~2 GB of CUDA libraries:
    #   pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
    "sentence-transformers==6.3.0",
    "torch==2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx2==2.16.2",  # used by FastAPI's TestClient (Starlette 1.x)
    "ruff==0.17.5",
    "mypy==2.4.1",
    "pyyaml==6.0.3",  # sample persona files (scripts/generate_samples.py)
    "types-pyyaml==6.0.12.20261113",
]

[tool.setuptools.packages.find]
include = ["app*"]

# --- ruff: lint + format ---------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "B008",     # FastAPI's Depends()/Query() in argument defaults is idiomatic
]
# Resume text is full of en and em dashes; they are data, not typos.
allowed-confusables = ["–", "—"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately feed the cleaner look-alike characters (full-width letters, NBSP).
"tests/**" = ["RUF001", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# backend/alembic/ (our migrations folder) would otherwise make ruff treat the
# alembic *library* as first-party.
known-third-party = ["alembic"]

# --- mypy ------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]
# PyMuPDF and python-docx ship type hints but leave many functions unannotated.
untyped_calls_exclude = ["pymupdf", "docx"]

[[tool.mypy.overrides]]
# lxml: only used for its XMLSyntaxError (python-docx's parser).
# spacy.tokenizer: a compiled (Cython) module that ships no type stub.
module = ["lxml.*", "spacy.tokenizer"]
ignore_missing_imports = true

# --- pytest ----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: needs a running Postgres + pgvector (docker compose up -d db)",
    "model: loads the real embedding model (downloaded once, ~90 MB); skip with -m 'not model'",
]
